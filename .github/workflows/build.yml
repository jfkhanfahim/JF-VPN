name: Build JF VPN Final
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Full JF VPN Project
        run: |
          mkdir -p app/src/main/java/com/jf/vpn
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          
          echo 'include(":app")' > settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.2.2" apply false }' > build.gradle.kts
          
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.jf.vpn"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.jf.vpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="JF VPN" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".JFVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="true"><intent-filter><action android:name="android.net.VpnService"/></intent-filter></service>
              </application>
          </manifest>
          EOF
          
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">JF VPN</string></resources>
          EOF
          
          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:background="#0A0A0A" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="JF VPN" android:textSize="38sp" android:textStyle="bold" android:textColor="#00FF88"/>
              <Button android:id="@+id/btn" android:layout_width="200dp" android:layout_height="200dp" android:layout_marginTop="40dp" android:text="CONNECT"/>
          </LinearLayout>
          EOF
          
          cat > app/src/main/java/com/jf/vpn/MainActivity.kt <<'EOF'
          package com.jf.vpn
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  findViewById<Button>(R.id.btn).setOnClickListener {
                      val i = VpnService.prepare(this)
                      if(i!=null) startActivityForResult(i, 100) else startService(Intent(this, JFVpnService::class.java))
                  }
              }
          }
          EOF
          
          cat > app/src/main/java/com/jf/vpn/JFVpnService.kt <<'EOF'
          package com.jf.vpn
          import android.content.Intent
          import android.net.VpnService
          class JFVpnService : VpnService() {
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  Builder().addAddress("10.0.0.2",32).addRoute("0.0.0.0",0).setSession("JF VPN").establish()
                  return START_STICKY
              }
          }
          EOF

      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: JF-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
